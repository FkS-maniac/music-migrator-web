<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yandex → Spotify importer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>🎵 Yandex → Spotify</h1>
    <p class="subtitle">Импорт из публичного плейлиста Яндекс Музыки в Spotify</p>
  </header>

  <nav class="tabs" id="tabs">
    <button data-direction="yandex-import" class="active">Публичный Yandex</button>
    <button data-direction="file-import">Импорт из файла</button>
  </nav>

  <main>
    <section id="yandex-import-panel" class="card panel">
      <h2>1. Сохраните iframe / ссылку Яндекс Музыки в файл</h2>
      <label>Вставьте iframe или ссылку</label>
      <textarea id="yandex-iframe" rows="6" placeholder="<iframe ... src=\"https://music.yandex.ru/iframe/playlist/...\"></iframe>"></textarea>

      <label>Proxy URL (если вы хотите пробовать выгрузку через proxy)</label>
      <input id="yandex-proxy" type="text" placeholder="https://my-worker.example.workers.dev">

      <div class="actions">
        <button id="make-file-btn" class="btn primary">Сохранить как файл</button>
        <button id="download-template-btn" class="btn">Скачать шаблон</button>
      </div>

      <div id="yandex-meta" class="meta hidden"></div>
    </section>

    <section id="file-import-panel" class="card panel hidden">
      <h2>2. Загрузите файл плейлиста</h2>
      <label>Файл JSON / TXT / CSV</label>
      <input id="playlist-file" type="file" accept=".json,.txt,.csv">

      <div class="actions">
        <button id="preview-file-btn" class="btn">Предпросмотр</button>
      </div>

      <textarea id="file-preview" rows="10" readonly placeholder="Тут появится текст из файла"></textarea>
    </section>

    <section class="card">
      <h2>3. Подключите Spotify</h2>
      <label>Client ID</label>
      <input id="spotify-client-id" type="text" placeholder="Spotify Client ID">
      <p class="hint" id="spotify-redirect-hint"></p>
      <button id="spotify-connect" class="btn">Подключить Spotify</button>
      <span id="spotify-status" class="status">не подключён</span>
    </section>

    <section class="card">
      <h2>4. Импорт в Spotify</h2>
      <button id="import-spotify" class="btn primary wide">Импортировать в Spotify</button>
      <div id="progress-wrap" class="hidden">
        <div id="progress-status" class="progress-status">Готово</div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
      </div>
    </section>

    <section id="report-card" class="card hidden">
      <h2>Отчёт</h2>
      <div id="report-summary" class="summary"></div>
      <ul id="report-list"></ul>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
