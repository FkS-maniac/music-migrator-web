<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yandex → Spotify importer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>🎵 Yandex → Spotify</h1>
    <p class="subtitle">Импорт публичного плейлиста Яндекс Музыки в Spotify через удобный список треков</p>
  </header>

  <main>
    <section class="card">
      <h2>1. Подключите Spotify</h2>
      <label>Client ID</label>
      <input id="spotify-client-id" type="text" placeholder="Spotify Client ID">
      <p class="hint" id="spotify-redirect-hint"></p>
      <button id="spotify-connect" class="btn">Подключить Spotify</button>
      <span id="spotify-status" class="status">не подключён</span>
    </section>

    <section class="card">
      <h2>2. Вставьте ссылку или iframe Яндекс Музыки</h2>
      <label>Ссылка / iframe</label>
      <input id="yandex-link" type="text" placeholder="https://music.yandex.ru/users/.../playlists/3 или iframe-код">

      <label>Proxy URL (обязательно для чтения публичного плейлиста)</label>
      <input id="yandex-proxy" type="text" placeholder="https://my-worker.example.workers.dev">

      <div class="row">
        <label class="switch"><input id="import-mode" type="checkbox"> Импортировать как отдельный плейлист в Spotify</label>
      </div>

      <div class="actions">
        <button id="parse-btn" class="btn primary">Распознать и собрать список</button>
        <button id="download-txt" class="btn">Скачать список (.txt)</button>
      </div>

      <div id="playlist-meta" class="meta hidden"></div>
    </section>

    <section class="card">
      <h2>3. Список треков</h2>
      <textarea id="track-list" readonly placeholder="После распознавания ссылка будет преобразована в список вида: Трек — Исполнитель"></textarea>
    </section>

    <section class="card">
      <h2>4. Импорт в Spotify</h2>
      <button id="import-spotify" class="btn primary wide">Импортировать в Spotify</button>
      <div id="progress-wrap" class="hidden">
        <div id="progress-status" class="progress-status">Готово</div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
      </div>
    </section>

    <section id="report-card" class="card hidden">
      <h2>Отчёт</h2>
      <div id="report-summary" class="summary"></div>
      <ul id="report-list"></ul>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
